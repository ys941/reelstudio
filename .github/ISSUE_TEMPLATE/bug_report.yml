name: 🐛 Bug report
description: Something behaves differently than you expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. You don't need to fill in every box —
        even a half-complete report is more useful than a missing one.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what did you get instead?
      placeholder: The exported MP4 has no audio even though the preview plays it.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How can it be reproduced?
      description: Rough steps are fine. "I'm not sure, it just happens sometimes" is also a valid answer.
      placeholder: |
        1. Go to …
        2. Click …
        3. See the problem

  - type: dropdown
    id: area
    attributes:
      label: Which part of the app?
      options:
        - Timeline (drag, trim, split, snapping)
        - Preview canvas / playback
        - Text, stickers or overlays
        - Filters, colour, crop or chroma key
        - Audio / voiceover
        - Export (MP4 / WebM / GIF)
        - Importing media
        - Setup or install
        - Not sure

  - type: textarea
    id: logs
    attributes:
      label: Any logs or errors?
      description: Paste anything relevant. It will be formatted automatically.
      render: shell
  - type: markdown
    attributes:
      value: |
        Include your browser and version — export and recording behave differently across browsers.

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Chrome 128 on Windows 11 — live demo / running locally
